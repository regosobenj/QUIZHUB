<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeIgniter 4 Exam Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <!-- VIP Login Gate -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <span class="login-logo-icon">🔒</span>
        <h1 class="login-title">CodeIgniter 4</h1>
        <p class="login-subtitle">Enter the specific password for this quiz.</p>
      </div>
      <div class="login-body">
        <input type="password" id="loginPassword" class="login-input" placeholder="Passcode" autocomplete="off" />
        <div id="loginError" class="login-error hidden">Invalid passcode.</div>
        <button id="loginBtn" class="login-submit">🔓 Enter Quiz</button>
      </div>
    </div>
  </div>

  <script>
    const VALID_HASHES = ['6db434a9b0cd52c5329b53603d776acfe5e60b7b8cf977b9395d1bb049ba2b07'];

    async function sha256(message) {
      const data = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Check if they unlocked this specific quiz
    if (localStorage.getItem('ci4_authenticated') === 'true') {
      document.body.classList.add('authenticated');
      document.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('loginOverlay');
        if(overlay) overlay.classList.add('hidden');
      });
    } else {
      document.body.classList.remove('authenticated');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('loginBtn');
      const pwInput = document.getElementById('loginPassword');
      const err = document.getElementById('loginError');

      async function attemptLogin() {
        const pw = pwInput.value.trim();
        if (!pw) return;
        const hash = await sha256(pw);
        if (VALID_HASHES.includes(hash)) {
          localStorage.setItem('ci4_authenticated', 'true');
          document.body.classList.add('authenticated');
          document.getElementById('loginOverlay').classList.add('hidden');
        } else {
          err.classList.remove('hidden');
          pwInput.value = '';
        }
      }

      if(btn) btn.addEventListener('click', attemptLogin);
      if(pwInput) pwInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') attemptLogin();
      });
    });
  </script>

  
  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-badge">
        <span class="logo-icon">🌐</span>
        <div class="logo-text">
          <a href="../index.html" style="color:var(--text-secondary); text-decoration:none; font-size:0.8rem; display:block; margin-bottom:4px;">← Back to Hub</a>
          <h1>CodeIgniter 4</h1>
          <span class="sub">Exam Certification Simulator & Reviewer</span>
        </div>
      </div>
    </div>

    <div class="header-center">
      <div class="stats-ticker">
        <div class="stat-item">
          <span class="stat-label">Progress</span>
          <span class="stat-val" id="progressVal">0 / 100</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Accuracy</span>
          <span class="stat-val" id="accuracyVal">0%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Bookmarked</span>
          <span class="stat-val" id="bookmarksVal">0</span>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="mode-toggles">
        <button id="btnStudyMode" class="btn-toggle active" title="Instant answers & explanations">📖 Study Mode</button>
        <button id="btnExamMode" class="btn-toggle" title="Timed exam simulation">⏱️ Exam Mode</button>
      </div>
      <button id="btnThemeToggle" class="btn-icon" title="Toggle Theme">🌓</button>
      <button id="btnLogout" class="btn-icon" title="Logout">🚪</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-layout">
    <!-- Sidebar / Question Navigator -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top" id="sidebarToggleBtn">
        <h3 id="sidebarTitle">Question Navigator</h3>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="badge" id="totalBadge">100 Qs</span>
          <span class="sidebar-toggle-icon" id="sidebarToggleIcon">▼</span>
        </div>
      </div>

      <div class="sidebar-content" id="sidebarContent">
        <!-- Filter Controls -->
      <div class="sidebar-filters">
        <input type="text" id="searchInput" placeholder="Search keywords..." />
        
        <select id="categoryFilter">
          <option value="ALL">All Domains</option>
          <option value="CodeIgniter Basics">1. CodeIgniter Basics (Q1-Q50)</option>
          <option value="CodeIgniter Advanced">2. CodeIgniter Advanced (Q51-Q100)</option>
        </select>

        <div class="filter-chips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="unanswered">Unanswered</button>
          <button class="chip" data-filter="incorrect">Incorrect</button>
          <button class="chip" data-filter="flagged">★ Flagged</button>
          <button class="chip" data-filter="diagrams">🖼️ Diagram Qs</button>
        </div>
      </div>
      
        <!-- Question Number Grid -->
        <div class="question-grid" id="questionGrid"></div>

        <!-- Quick Actions -->
        <div class="sidebar-actions">
          <button id="btnResetQuiz" class="btn-secondary btn-sm">↺ Reset Answers</button>
          <button id="btnRevealAll" class="btn-secondary btn-sm">👁️ Reveal All</button>
        </div>
      </div> <!-- End of sidebar-content -->
    </aside>

    <!-- Quiz Content Panel -->
    <main class="quiz-content">

      <!-- Progress Bar -->
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
      </div>

      <!-- Question Card Container -->
      <div id="cardContainer" class="card-container">
        <!-- Rendered dynamically via app.js -->
      </div>

      <!-- Navigation Footer -->
      <div class="quiz-footer">
        <button id="btnPrev" class="btn-nav">← Previous</button>
        <div class="footer-center">
          <span id="qIndexText">Question 1 of 100</span>
          <span class="pdf-ref-badge" id="pdfRefBadge">Slide #5</span>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button id="btnNext" class="btn-nav">Next →</button>
          <button id="btnFinishExam" class="btn-primary" style="display: none;">Submit Exam</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Image Modal / Zoom View -->
  <div id="imageModal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Diagram & Topology Inspector</span>
        <button id="closeModal" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <img id="modalImage" src="" alt="Enlarged Diagram" />
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
